name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify archive layout
        run: |
          zip=$(ls .release/*.zip)
          unzip -l "$zip"
          for f in BuyEmAll.toc BuyEmAll.lua BuyEmAll.xml init.lua LICENSE localisation/index.xml localisation/enUS.lua; do
            unzip -l "$zip" | grep -q "BuyEmAll/$f" || { echo "missing BuyEmAll/$f" >&2; exit 1; }
          done
          if unzip -l "$zip" | grep -q 'BuyEmAll/.github/'; then
            echo ".github/ should not ship in the release archive (see .pkgmeta)" >&2
            exit 1
          fi
