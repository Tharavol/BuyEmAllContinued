name: Pre-release

on:
  push:
    tags:
      # alpha/beta only: the packager reads "alpha"/"beta" from the tag name to mark the GitHub release as a
      # prerelease. Stable vX.Y.Z tags go through release.yml, so the two never both run on one tag.
      - "v[0-9]+.[0-9]+.[0-9]+-alpha*"
      - "v[0-9]+.[0-9]+.[0-9]+-beta*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Fails before anything is published if CHANGELOG.md has no section for this tag. Written outside the
      # checkout so the packager doesn't pick it up.
      - name: Extract release notes
        run: sh .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      # Publishes to GitHub only, like release.yml.
      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify archive layout
        run: sh .github/scripts/check-archive.sh

      # The packager posts the whole of CHANGELOG.md (.pkgmeta manual-changelog) as the release body; replace it
      # with this version's section.
      - name: Set release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
