name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@v6

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Luacheck
        run: luacheck .

      # The tests need the bit library, which LuaJIT includes and plain Lua 5.1 doesn't.
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit

      # Runs the addon against stand-in WoW APIs; no game client needed.
      - name: Tests
        run: luajit tests/run_tests.lua

  package:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # If this push also carries a tag on HEAD (e.g. a release commit pushed
      # together with its tag), BigWigsMods/packager intentionally no-ops on
      # the branch push to avoid a duplicate build, leaving no zip behind.
      # Detect that ourselves so the later steps skip deterministically
      # instead of racing the tag ref and failing when they lose.
      - name: Check for pending tag
        id: check_tag
        run: echo "tag=$(git tag --points-at HEAD)" >> "$GITHUB_OUTPUT"

      # -d skips uploading, so this builds the real release zip on every push
      # without publishing it. Packaging breakage surfaces here rather than
      # at tag time.
      - name: Package (dry run)
        if: steps.check_tag.outputs.tag == ''
        uses: BigWigsMods/packager@v2
        with:
          args: -d

      - name: Verify archive layout
        if: steps.check_tag.outputs.tag == ''
        run: |
          zip=$(ls .release/*.zip)
          unzip -l "$zip"
          for f in BuyEmAll.toc BuyEmAll.lua BuyEmAll.xml init.lua LICENSE localisation/index.xml localisation/enUS.lua; do
            unzip -l "$zip" | grep -q "BuyEmAll/$f" || { echo "missing BuyEmAll/$f" >&2; exit 1; }
          done

          # Dev-only tooling / docs; .pkgmeta ignores them, and they should stay ignored.
          # A bare `!` here would be exempt from set -e and silently not fail.
          for f in .github/ .luacheckrc tests/ CHANGELOG.md; do
            if unzip -l "$zip" | grep -q "BuyEmAll/$f"; then
              echo "$f should not ship in the release archive (see .pkgmeta)" >&2
              exit 1
            fi
          done
