name: Bug report
description: A Lua error, or BuyEmAll buying or showing the wrong amount.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What was done, what was expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Lua error
      description: >
        The full error text, if there was one. With BugSack and BugGrabber installed, copy the whole entry,
        including the Locals section. Without them, `/console scriptErrors 1` shows errors in game.
      render: text
  - type: input
    id: game-version
    attributes:
      label: Game version
      description: Shown at the bottom left of the character select screen, or with `/dump GetBuildInfo()`.
      placeholder: "12.1.5"
    validations:
      required: true
  - type: input
    id: addon-version
    attributes:
      label: BuyEmAll Continued version
      description: Shown in the AddOns list on the character select screen.
      placeholder: "4.1.6"
    validations:
      required: true
  - type: input
    id: vendor-item
    attributes:
      label: Vendor and item
      description: The vendor (name and zone) and the item that was shift-clicked, and what it costs.
      placeholder: Vendor name and zone; item name and its price
    validations:
      required: true
  - type: textarea
    id: addons
    attributes:
      label: Other merchant or bag addons
      description: Other addons that change the vendor window or the bags (for example Krowi's Extended Vendor UI, Scrap, BlizzMove, Bagnon, ArkInventory).
